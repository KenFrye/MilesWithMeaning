<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videos | Miles With Meaning</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f8fa;
      color: #183146;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 40px 24px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
      color: #05213f;
    }

    .intro {
      color: #65758a;
      font-size: 18px;
      margin-bottom: 35px;
    }

    .back {
      display: inline-block;
      margin-bottom: 25px;
      color: #05213f;
      font-weight: 700;
      text-decoration: none;
    }

    .video-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
}

    .video-card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(10,49,93,.09);
    }

   .video-card video {
    width: 100%;
    aspect-ratio: 9 / 16;
    object-fit: contain;
    display: block;
    background: #111;
}
    .video-info {
      padding: 20px;
    }

    .video-info h2 {
      margin: 0 0 8px;
      font-size: 21px;
    }

    .video-info p {
      margin: 0;
      color: #65758a;
      line-height: 1.5;
    }
 @media (max-width: 800px) {
    .video-grid {
        grid-template-columns: 1fr;
    }
}
</style>
  </head>

<body>

  <div class="container">

    <a class="back" href="index.html">← Back to Home</a>

    <h1>Videos</h1>

    <p class="intro">
      Stories from the miles, the people, and the causes behind Miles With Meaning.
    </p>

    <div class="video-grid">

      <div class="video-card">
    <video controls>
        <source src="assets/videos/APA-Cat-Condo.mp4" type="video/mp4">
    </video>
    <div class="video-info">
        <h2>APA Cat Condo</h2>
        <p>Supporting animals in need at the APA of Missouri.</p>
    </div>
</div>

    </div>

  </div>

</body>
</html>
